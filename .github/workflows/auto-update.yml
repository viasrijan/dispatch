name: Auto Update Dispatch

on:
  schedule:
    # Every 30 minutes, the Dispatch bot fetches stories and scores,
    # curates them and commits — GitHub Pages then auto-rebuilds the site.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: dispatch-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and curate content
        run: node scripts/fetch-content.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dispatch-bot"
          git config user.email "dispatch-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No content changes — nothing to post."
            exit 0
          fi
          git commit -m "Auto dispatch: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
