name: Auto Update Dispatch

on:
  schedule:
    # Every 30 minutes, the Dispatch bot fetches stories and scores,
    # curates them and commits — GitHub Pages then auto-rebuilds the site.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: dispatch-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and curate content
        run: node scripts/fetch-content.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dispatch-bot"
          git config user.email "dispatch-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No content changes — nothing to post."
            exit 0
          fi
          git commit -m "Auto dispatch: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push origin main 2>/dev/null; then
              echo "Posted."
              exit 0
            fi
            # A concurrent run pushed meanwhile. Each run rewrites data/*.json
            # wholesale, so the rebase always conflicts there — keep the freshly
            # generated content (theirs during rebase) and continue.
            git pull --rebase --autostash origin main 2>/dev/null || true
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git checkout --theirs data/ 2>/dev/null
              git add data/
              GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || true
            fi
            sleep 2
          done
          echo "Push kept racing — the next cycle will resolve it."
          exit 1
